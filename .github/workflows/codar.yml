name: Codar Daily

on:
  push:
    branches:
      - main
  schedule:
    # Every six hours (UTC). The Codar claim window is rolling 24 hours, so a
    # later run can catch the next window without claiming twice.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codar-daily
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff>=0.9,<1"

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_codar_daily.py" -v

      - name: Compile
        run: python -m compileall -q codar_daily.py tests

      - name: Lint
        run: ruff check codar_daily.py tests

  claim:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      PYTHONUTF8: "1"
      CODAR_READBACK_ATTEMPTS: "3"
      CODAR_READBACK_DELAY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check credentials
        id: credentials
        shell: bash
        env:
          CODAR_TOKENS: ${{ secrets.CODAR_TOKENS }}
          CODAR_TOKEN: ${{ secrets.CODAR_TOKEN }}
          CODAR_COOKIES: ${{ secrets.CODAR_COOKIES }}
          CODAR_COOKIE: ${{ secrets.CODAR_COOKIE }}
        run: |
          if [ -n "${CODAR_TOKENS:-}" ] || [ -n "${CODAR_TOKEN:-}" ] \
            || [ -n "${CODAR_COOKIES:-}" ] || [ -n "${CODAR_COOKIE:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Codar Daily::Credentials detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Codar Daily::No Codar credentials configured; scheduled claim skipped."
          fi

      - name: Run Codar
        if: steps.credentials.outputs.available == 'true'
        env:
          CODAR_TOKENS: ${{ secrets.CODAR_TOKENS }}
          CODAR_TOKEN: ${{ secrets.CODAR_TOKEN }}
          CODAR_COOKIES: ${{ secrets.CODAR_COOKIES }}
          CODAR_COOKIE: ${{ secrets.CODAR_COOKIE }}
          CODAR_USERNAME: ${{ secrets.CODAR_USERNAME }}
        shell: bash
        run: |
          set -o pipefail
          python codar_daily.py | tee codar-report.jsonl

      - name: Build JSON report
        if: always() && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("codar-report.jsonl")
          out = Path("codar-report.json")
          rows = []
          if raw.exists():
              for line in raw.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      rows.append(json.loads(line))
          out.write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload report
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codar-report-${{ github.run_id }}
          path: |
            codar-report.json
            codar-report.jsonl
          if-no-files-found: warn
          retention-days: 30
