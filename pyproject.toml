[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codar-daily"
version = "1.0.0"
description = "Codar daily check-in runner with strict server-side readback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "L0NE-6" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1",
]

[project.scripts]
codar-daily = "codar_daily:main"

[project.urls]
Homepage = "https://github.com/L0NE-6/Codar-Daily"
Issues = "https://github.com/L0NE-6/Codar-Daily/issues"

[tool.setuptools]
py-modules = ["codar_daily"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
